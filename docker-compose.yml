services:
  view:
    image: eddfish/accounting:0.1.0
    container_name: accounting
    ports:
      - "80:80"
    depends_on:
      - forum-service
  forum-service:
    image: eddfish/forum-service:0.1.0
    container_name: forum
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb+srv://edd:12345.com@cluster0.ipqvsis.mongodb.net/java59?retryWrites=true&w=majority&appName=Cluster0
      - PORT=8080
      - DB_NAME=java59